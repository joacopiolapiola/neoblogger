name: Nightly Latest Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE20: true

jobs:
  build:
    name: Build & Update Latest Release
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradlew Executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew app:assembleDebug --no-daemon

      - name: Update Latest Release Tag
        uses: ncipollo/release-action@v1
        with:
          artifacts: "app/build/outputs/apk/debug/app-debug.apk"
          tag: "latest"
          name: "Neoblogger App Latest Release"
          body: "🚀 Latest Neoblogger Android App Build. Download `app-debug.apk` below directly to install on your Android device."
          allowUpdates: true
          recreate: true
          token: ${{ secrets.GITHUB_TOKEN }}
