name: Pure Native Nightly Latest Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Native Build & Update Latest Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code via Native Git
        run: |
          git clone --depth 1 "https://github.com/${{ github.repository }}.git" .
          git checkout ${{ github.sha }}

      - name: Setup Java 17 & Android SDK 35
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH

          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platform-tools" || true

      - name: Build Debug APK via Gradlew
        run: |
          chmod +x gradlew
          ./gradlew app:assembleDebug --no-daemon --stacktrace

      - name: Update Latest Release via Native GitHub CLI (gh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "latest" app/build/outputs/apk/debug/app-debug.apk \
            --title "Neoblogger App Latest Release" \
            --notes "🚀 Latest Neoblogger Android App Build. Download app-debug.apk directly below." \
            --clobber || \
          gh release upload "latest" app/build/outputs/apk/debug/app-debug.apk --clobber
