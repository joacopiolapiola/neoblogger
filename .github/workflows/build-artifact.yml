name: Pure Native Build & Store Artifact

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Native Build & Store APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code via Native Git
        run: |
          git clone --depth 1 "https://github.com/${{ github.repository }}.git" .
          git checkout ${{ github.sha }}

      - name: Install JDK 17 & Android SDK via Native Shell
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk wget unzip
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH

          mkdir -p $HOME/android-sdk/cmdline-tools
          cd $HOME/android-sdk/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          mv cmdline-tools latest
          rm tools.zip

          export ANDROID_HOME=$HOME/android-sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Build Debug APK via Gradlew
        run: |
          chmod +x gradlew
          ./gradlew app:assembleDebug --no-daemon

      - name: Upload Artifact via GitHub Actions v4
        uses: actions/upload-artifact@v4
        with:
          name: Neoblogger-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
