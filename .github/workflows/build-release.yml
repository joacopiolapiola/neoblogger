name: Pure Native Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Native Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code via Native Git
        run: |
          git clone --depth 1 "https://github.com/${{ github.repository }}.git" .
          git checkout ${{ github.sha }}

      - name: Setup Java 17 & Android SDK 35
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          echo "JAVA_HOME=$JAVA_HOME" >> $GITHUB_ENV
          echo "$JAVA_HOME/bin" >> $GITHUB_PATH

          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "platform-tools" || true

      - name: Build Debug APK via Gradlew
        run: |
          chmod +x gradlew
          ./gradlew app:assembleDebug --no-daemon --stacktrace

      - name: Create GitHub Release via Native GitHub CLI (gh)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG_NAME"
          git push origin "$TAG_NAME" --force || true

          gh release create "$TAG_NAME" app/build/outputs/apk/debug/app-debug.apk \
            --title "Neoblogger App Release $TAG_NAME" \
            --notes "🚀 Automated Neoblogger Android App Build ($TAG_NAME). Download app-debug.apk directly below." \
            --clobber || \
          gh release upload "$TAG_NAME" app/build/outputs/apk/debug/app-debug.apk --clobber
